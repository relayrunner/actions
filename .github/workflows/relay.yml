# RelayRunner relay: asks RelayRunner where the caller's next job should run.
#
#   jobs:
#     relay:
#       uses: relayrunner/actions/.github/workflows/relay.yml@v1
#       with:
#         machine: macOS, ARM64
#         github: macos-latest
#     test:
#       needs: relay
#       runs-on: ${{ needs.relay.outputs.runner }}
#
# The job says which runners can run it, one input per provider. The workspace's runner order in
# the RelayRunner dashboard decides which of them to try first.
#
# The `relay` job below asks for the `relayrunner` label. RelayRunner's gateway answers it as a
# runner of its own: it claims the job, reports the `runner` output and skips the steps, so no
# runner minutes are billed. When no runner fits, the gateway fails the relay job with the reason,
# and the job that needs it doesn't start. Public repos never get a machine. A hosted provider
# (Blacksmith, Depot, Namespace, WarpBuild, Ubicloud, RunsOn) needs its own GitHub App installed on
# the org, and runs public repos too.
#
# One relay routes one job: a machine label can only be claimed once, so give each job that should
# be able to run on a machine its own relay.
name: RelayRunner relay

on:
  workflow_call:
    inputs:
      machine:
        description: Comma-separated labels a workspace machine must have, all of them, to run this job. Use `self-hosted` for any machine, or narrow it, such as `macOS, ARM64`. Leave it out if the job shouldn't run on your machines.
        type: string
      github:
        description: GitHub-hosted runner label for this job, such as ubuntu-latest. Leave it out if the job shouldn't run on GitHub-hosted runners.
        type: string
      blacksmith:
        description: Blacksmith runner label for this job, such as blacksmith-2vcpu-ubuntu-2404. Leave it out if the job shouldn't run on Blacksmith.
        type: string
      depot:
        description: Depot runner label for this job, such as depot-ubuntu-24.04. Leave it out if the job shouldn't run on Depot.
        type: string
      namespace:
        description: Namespace runner label for this job, such as namespace-profile-default. Leave it out if the job shouldn't run on Namespace.
        type: string
      warpbuild:
        description: WarpBuild runner label for this job, such as warp-ubuntu-latest-x64-2x. Leave it out if the job shouldn't run on WarpBuild.
        type: string
      ubicloud:
        description: Ubicloud runner label for this job, such as ubicloud-standard-2. Leave it out if the job shouldn't run on Ubicloud.
        type: string
      runs-on:
        description: RunsOn runner label for this job, such as runs-on=<run id>/runner=2cpu-linux-x64 with the run id from github.run_id. Leave it out if the job shouldn't run on RunsOn.
        type: string
    outputs:
      runner:
        description: The label to put in the next job's runs-on.
        value: ${{ jobs.relay.outputs.runner }}

jobs:
  relay:
    name: RelayRunner
    runs-on: relayrunner
    outputs:
      runner: ${{ steps.route.outputs.runner }}
    steps:
      # Only runs if an ordinary runner with the `relayrunner` label takes this job. The gateway
      # reports the output itself and skips this step.
      - id: route
        run: |
          echo "::error title=RelayRunner didn't answer this relay::A runner other than RelayRunner's gateway took this relay job, so there is no runner to report. Remove the relayrunner label from your own runners."
          exit 1
